[paths]
inputs = "preprocessed"
outputs = "output"

[api]
url = "https://tokenhub.tencentmaas.com/v1/chat/completions"
model = "hy-mt2-pro"
fallback_models = ["hy-mt2-plus", "hy-mt2-lite"]
key_env = "TRANSLATION_API_KEY"
timeout_seconds = 120
temperature = 0.0
max_output_tokens = 4096
max_total_tokens = 990000

[translate]
source_lang = "English"
target_lang = "Simplified Chinese"
batch_token_budget = 1500
max_batch_units = 20
max_unit_tokens = 1200
context_units = 0
max_retries = 1
workers = 5
