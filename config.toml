# Markdown translation and publishing defaults.
# Put endpoint settings in config.local.toml and the API key in an environment
# variable. No translation API is selected by default.

[paths]
inputs = "inputs"
outputs = "output"

[api]
url = ""
model = ""
key_env = "TRANSLATION_API_KEY"
timeout_seconds = 120
temperature = 0.0
max_output_tokens = 3072

[translate]
source_lang = "English"
target_lang = "Simplified Chinese"
batch_token_budget = 640
max_batch_units = 10
max_unit_tokens = 480
context_units = 1
max_retries = 2

[layout]
order = "zh-first"
heading_style = "italic-below"
markers = true

[publish]
repo = "chenjing002/hy-ebook-translator"
branch = "main"
protocol = "ssh"
site_title = "双语书架"
site_subtitle = "Bilingual Library"
include_inputs = false

# Shelf labels. A converted book often opens with front matter or a title split
# across lines, so the heading in the file is not always the book's title.
# Anything not listed here keeps the title taken from the document itself.
[titles]
"Security Analysis seventh Edition.md" = { zh = "证券分析（第七版）", en = "Security Analysis, Seventh Edition" }
"How to lie with statistics.md" = { zh = "如何用统计数据撒谎", en = "How to Lie with Statistics" }
"Financial Statement Analysis_ A Practitioner's Guide.md" = { zh = "财务报表分析：从业者指南", en = "Financial Statement Analysis: A Practitioner's Guide" }
"Special Situation Investing Classes CBS Joel Greenblatees.md" = { zh = "特殊情况投资课程（哥大商学院·乔尔·格林布拉特）", en = "Special Situation Investing Classes" }
"Show Me the Money Writing Business.pdf.md" = { zh = "给我看钱：商业财经写作", en = "Show Me the Money: Writing Business and Economics Stories" }
"浑水做空辉山乳业报告.md" = { zh = "中国辉山乳业（6863 HK）：几近归零", en = "China Huishan Dairy (6863 HK): A Near Zero" }
