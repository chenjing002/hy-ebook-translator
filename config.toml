# ─────────────────────────────────────────────────────────────────────────────
# hy-ebook-translator — local Markdown translation & publishing pipeline
# Everything runs on-device via Apple MLX. No cloud translation APIs.
# Override any value by copying this file to config.local.toml.
# ─────────────────────────────────────────────────────────────────────────────

[model]
# MLX weights for Tencent Hunyuan's Hy-MT2 translation model.
#   mlx-community/Hy-MT2-7B        bf16, ~15 GB  (needs >=32 GB unified memory)
#   mlx-community/Hy-MT2-7B-8bit   ~8 GB         (recommended on 16 GB Macs)
#   mlx-community/Hy-MT2-7B-4bit   ~4.5 GB       (fastest, slight quality loss)
repo = "mlx-community/Hy-MT2-7B-8bit"
# Upstream-recommended sampling parameters for the 1.8B / 7B dense models.
temperature = 0.7
top_p = 0.6
top_k = 20
# From the model's own generation_config.json; keeps long documents from
# falling into repetition loops.
repetition_penalty = 1.05
# Hard ceiling on generated tokens per request.
max_new_tokens = 3072

[translate]
source_lang = "English"
target_lang = "Simplified Chinese"
# Hy-MT2 ships both a Chinese and an English instruction template. The Chinese
# one is recommended whenever the target language is Chinese.
prompt_lang = "zh"
# Segments are packed into one generation request up to this token budget.
batch_token_budget = 640
max_batch_units = 10
# Single segments longer than this are split on sentence boundaries.
max_unit_tokens = 480
# Number of preceding segments supplied as background context (0 disables).
context_units = 1
# Retries when the model drops a protected placeholder or a segment marker.
max_retries = 2

[layout]
# "zh-first" puts the Chinese translation above the English original.
order = "zh-first"
# How an English heading is carried over: "italic-below" | "inline" | "none"
heading_style = "italic-below"
# Emit invisible <!--en--> HTML comments so the reading site can style the
# original-language blocks differently. Harmless in any other renderer.
markers = true

[publish]
repo = "chenjing002/hy-ebook-translator"
branch = "main"
protocol = "ssh"
site_title = "双语书架"
site_subtitle = "Bilingual Library · 本地 Hy-MT2 翻译"
# Push the English source files too. Off by default: your inputs may be
# copyrighted material you do not want on a public repository.
include_inputs = false
